
<div id="erd" style="padding: 8px 0"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"anthropic-sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"anthropic-sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const { svg } = await mermaid.render('erd-svg', `erDiagram
  users {
    uuid id PK
    string email
    string password_hash
    string name
    timestamp created_at
  }
  user_preferences {
    uuid id PK
    uuid user_id FK
    array dietary_restrictions
    array allergies
    array preferred_cuisines
    int default_servings
    string measurement_unit
  }
  pantry_items {
    uuid id PK
    uuid user_id FK
    string name
    decimal quantity
    string unit
    string category
    date expiry_date
    boolean is_running_low
  }
  recipes {
    uuid id PK
    uuid user_id FK
    string name
    string cuisine_type
    string difficulty
    int prep_time
    int cook_time
    int servings
    jsonb instructions
    array dietary_tags
  }
  recipe_ingredients {
    uuid id PK
    uuid recipe_id FK
    string ingredient_name
    decimal quantity
    string unit
  }
  recipe_nutrition {
    uuid id PK
    uuid recipe_id FK
    int calories
    decimal protein
    decimal carbs
    decimal fats
    decimal fiber
  }
  meal_plans {
    uuid id PK
    uuid user_id FK
    uuid recipe_id FK
    date meal_date
    string meal_type
  }
  shopping_list_items {
    uuid id PK
    uuid user_id FK
    string ingredient_name
    decimal quantity
    string unit
    string category
    boolean is_checked
    boolean from_meal_plan
  }
  users ||--o{ user_preferences : "has"
  users ||--o{ pantry_items : "owns"
  users ||--o{ recipes : "saves"
  users ||--o{ meal_plans : "plans"
  users ||--o{ shopping_list_items : "manages"
  recipes ||--o{ recipe_ingredients : "has"
  recipes ||--|| recipe_nutrition : "has"
  recipes ||--o{ meal_plans : "used in"
`);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});
document.querySelectorAll('#erd svg .row-rect-odd path, #erd svg .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
